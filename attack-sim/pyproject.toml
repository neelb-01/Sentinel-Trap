[project]
name = "attack-sim"
version = "0.1.0"
description = "SentinelTrap synthetic attack-traffic generator"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
attack-sim = "attack_sim.runner:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
