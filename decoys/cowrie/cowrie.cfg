# Cowrie configuration for SentinelTrap.
#
# Only what differs from cowrie.cfg.dist. The JSON log is the contract with the
# tailer; do not disable it.

[honeypot]
hostname = srv-prod-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = true
ttylog_path = var/lib/cowrie/tty

# Report the session as if it ran on a small cloud VM.
arch = linux-x64-lsb
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux

# Attackers who never fail a login look scripted; a little friction is realistic.
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.9

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# The tailer consumes this file. Everything downstream depends on it.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# Terminal output is for humans watching `docker logs`, not for the pipeline.
[output_textlog]
enabled = false
