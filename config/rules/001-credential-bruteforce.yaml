id: credential-bruteforce
name: Repeated failed logins from one source
severity: 0.6
enabled: true
description: >
  More than 20 failed login attempts in a single session. Catches the obvious
  hydra-style case; the classifier is what covers the slow and distributed ones.
match:
  all:
    - field: features.credential_attempts
      op: gte
      value: 20
    - field: features.distinct_passwords
      op: gte
      value: 10
